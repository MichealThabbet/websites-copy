name: Stop Books Phase 2 After Three Minutes
true:
  push:
    branches:
    - run/books-phase2
permissions:
  contents: read
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Stop at deadline and count saved books
      env:
        GH_TOKEN: ${{ github.token }}
      run: "python3 -u - <<'PY'\nimport datetime,io,json,os,time,urllib.request,urllib.error,zipfile\n\
        BASE='https://api.github.com/repos/MichealThabbet/websites-copy'\nRUN=None\n\
        DEADLINE=1793780642\ndef api(path,method='GET'):\n    req=urllib.request.Request(BASE+path,method=method,headers={'Authorization':'Bearer\
        \ '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})\n\
        \    with urllib.request.urlopen(req,timeout=30) as r:\n        body=r.read();return\
        \ json.loads(body) if body else {}\nwhile RUN is None:\n    runs=api('/actions/workflows/books-phase2.yml/runs?branch=run/books-phase2&per_page=1')['workflow_runs']\n\
        \    if runs:RUN=runs[0]['id']\n    else:time.sleep(1)\nwhile time.time()<DEADLINE:time.sleep(min(1,DEADLINE-time.time()))\n\
        stopped=datetime.datetime.now(datetime.timezone.utc).isoformat()\ntry:api(f'/actions/runs/{RUN}/force-cancel','POST')\n\
        except urllib.error.HTTPError as exc:\n    if exc.code!=409:raise\nprint('::notice\
        \ title=Stop request::'+stopped,flush=True)\nfor _ in range(12):\n    state=api(f'/actions/runs/{RUN}')\n\
        \    if state['status']=='completed':break\n    time.sleep(2)\nprint('::notice\
        \ title=Run state::'+state['status']+' / '+str(state.get('conclusion')),flush=True)\n\
        class NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self,*args,**kwargs):return\
        \ None\nopener=urllib.request.build_opener(NoRedirect)\ndef archive_url(artifact):\n\
        \    req=urllib.request.Request(BASE+f'/actions/artifacts/{artifact}/zip',headers={'Authorization':'Bearer\
        \ '+os.environ['GH_TOKEN']})\n    try:opener.open(req,timeout=30)\n    except\
        \ urllib.error.HTTPError as e:\n        if e.code in (301,302,303,307):return\
        \ e.headers['Location']\n        raise\n    raise ValueError('Expected artifact\
        \ redirect')\nclass RemoteZip(io.RawIOBase):\n    def __init__(self,url):\n\
        \        self.url=url;self.pos=0\n        req=urllib.request.Request(url,headers={'Range':'bytes=0-0'})\n\
        \        with urllib.request.urlopen(req,timeout=30) as r:\n            if\
        \ r.status!=206:raise ValueError('Range unsupported')\n            self.size=int(r.headers['Content-Range'].split('/')[-1]);r.read(1)\n\
        \    def seekable(self):return True\n    def readable(self):return True\n\
        \    def tell(self):return self.pos\n    def seek(self,offset,whence=0):\n\
        \        self.pos=offset if whence==0 else self.pos+offset if whence==1 else\
        \ self.size+offset\n        return self.pos\n    def read(self,n=-1):\n  \
        \      n=self.size-self.pos if n<0 else min(n,self.size-self.pos)\n      \
        \  if n<=0:return b''\n        if n>2*1024*1024:raise ValueError('Metadata\
        \ range limit')\n        req=urllib.request.Request(self.url,headers={'Range':f'bytes={self.pos}-{self.pos+n-1}'})\n\
        \        with urllib.request.urlopen(req,timeout=30) as r:\n            if\
        \ r.status!=206:raise ValueError('Range unsupported')\n            data=r.read(n)\n\
        \        self.pos+=len(data);return data\nartifacts=api(f'/actions/runs/{RUN}/artifacts?per_page=100')['artifacts']\n\
        books={};failures=[];unreadable=[]\nfor a in artifacts:\n    if not a['name'].startswith('books-batch-'):continue\n\
        \    try:\n        with zipfile.ZipFile(RemoteZip(archive_url(a['id']))) as\
        \ z:\n            name=next(n for n in z.namelist() if n.endswith('manifest.json'))\n\
        \            entries=json.loads(z.read(name))\n        for e in entries:\n\
        \            if 'file' in e:books[e['url']]=e\n            else:failures.append(e)\n\
        \    except Exception as e:unreadable.append({'artifact':a['name'],'error':str(e)})\n\
        result={'stop_requested_at':stopped,'run_state':state['status'],'conclusion':state.get('conclusion'),'catalog_total':1378,'saved_files':len(books),'remaining_not_saved':1378-249-len(books),'previous_saved':249,'total_saved':249+len(books),'failed_attempts':len(failures),'unreadable_artifacts':unreadable,'books':list(books.values()),'failures':failures}\n\
        os.makedirs('report',exist_ok=True)\nwith open('report/stop-report.json','w')\
        \ as f:json.dump(result,f,ensure_ascii=False,indent=2)\nsummary=f\"NewSaved={len(books)};\
        \ TotalSaved={249+len(books)}; Remaining={1378-249-len(books)}; FailedAttempts={len(failures)};\
        \ UnreadableArtifacts={len(unreadable)}\"\nprint('::notice title=Final saved\
        \ counts::'+summary,flush=True)\nif unreadable:print('::warning title=Incomplete\
        \ count::'+json.dumps(unreadable),flush=True)\nPY\n"
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: always()
      with:
        name: phase2-stopped-books-report
        path: report/
        retention-days: 7
