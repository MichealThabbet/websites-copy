name: Stop Books At Owner Deadline
on:
  push:
    branches: [run/stop-books]
permissions:
  contents: read
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stop at deadline and count saved books
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import datetime,io,json,os,time,urllib.request,urllib.error,zipfile
          BASE='https://api.github.com/repos/MichealThabbet/websites-copy'
          RUN=41758227497
          DEADLINE=1793758242
          def api(path,method='GET'):
              req=urllib.request.Request(BASE+path,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read();return json.loads(body) if body else {}
          while time.time()<DEADLINE:time.sleep(min(1,DEADLINE-time.time()))
          stopped=datetime.datetime.now(datetime.timezone.utc).isoformat()
          try:api(f'/actions/runs/{RUN}/force-cancel','POST')
          except urllib.error.HTTPError as exc:
              if exc.code!=409:raise
          print('::notice title=Stop request::'+stopped,flush=True)
          for _ in range(12):
              state=api(f'/actions/runs/{RUN}')
              if state['status']=='completed':break
              time.sleep(2)
          print('::notice title=Run state::'+state['status']+' / '+str(state.get('conclusion')),flush=True)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect)
          def archive_url(artifact):
              req=urllib.request.Request(BASE+f'/actions/artifacts/{artifact}/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              try:opener.open(req,timeout=30)
              except urllib.error.HTTPError as e:
                  if e.code in (301,302,303,307):return e.headers['Location']
                  raise
              raise ValueError('Expected artifact redirect')
          class RemoteZip(io.RawIOBase):
              def __init__(self,url):
                  self.url=url;self.pos=0
                  req=urllib.request.Request(url,headers={'Range':'bytes=0-0'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      if r.status!=206:raise ValueError('Range unsupported')
                      self.size=int(r.headers['Content-Range'].split('/')[-1]);r.read(1)
              def seekable(self):return True
              def readable(self):return True
              def tell(self):return self.pos
              def seek(self,offset,whence=0):
                  self.pos=offset if whence==0 else self.pos+offset if whence==1 else self.size+offset
                  return self.pos
              def read(self,n=-1):
                  n=self.size-self.pos if n<0 else min(n,self.size-self.pos)
                  if n<=0:return b''
                  if n>2*1024*1024:raise ValueError('Metadata range limit')
                  req=urllib.request.Request(self.url,headers={'Range':f'bytes={self.pos}-{self.pos+n-1}'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      if r.status!=206:raise ValueError('Range unsupported')
                      data=r.read(n)
                  self.pos+=len(data);return data
          artifacts=api(f'/actions/runs/{RUN}/artifacts?per_page=100')['artifacts']
          books={};failures=[];unreadable=[]
          for a in artifacts:
              if not a['name'].startswith('books-batch-'):continue
              try:
                  with zipfile.ZipFile(RemoteZip(archive_url(a['id']))) as z:
                      name=next(n for n in z.namelist() if n.endswith('manifest.json'))
                      entries=json.loads(z.read(name))
                  for e in entries:
                      if 'file' in e:books[e['url']]=e
                      else:failures.append(e)
              except Exception as e:unreadable.append({'artifact':a['name'],'error':str(e)})
          result={'stop_requested_at':stopped,'run_state':state['status'],'conclusion':state.get('conclusion'),'catalog_total':1378,'saved_files':len(books),'remaining_not_saved':1378-len(books),'failed_attempts':len(failures),'unreadable_artifacts':unreadable,'books':list(books.values()),'failures':failures}
          os.makedirs('report',exist_ok=True)
          with open('report/stop-report.json','w') as f:json.dump(result,f,ensure_ascii=False,indent=2)
          summary=f"Saved={len(books)}; Remaining={1378-len(books)}; FailedAttempts={len(failures)}; UnreadableArtifacts={len(unreadable)}"
          print('::notice title=Final saved counts::'+summary,flush=True)
          if unreadable:print('::warning title=Incomplete count::'+json.dumps(unreadable),flush=True)
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: stopped-books-report
          path: report/
          retention-days: 7
