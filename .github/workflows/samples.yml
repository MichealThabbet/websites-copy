name: Three Saved Book Samples
'on':
  push:
    branches:
    - run/book-samples
permissions:
  contents: read
  actions: read
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - env:
        GH_TOKEN: ${{ github.token }}
      run: "python3 -u - <<'PY'\nimport datetime,io,json,os,time,urllib.request,urllib.error,zipfile\n\
        BASE='https://api.github.com/repos/MichealThabbet/websites-copy'\nRUN=41758227497\n\
        DEADLINE=1793758242\ndef api(path,method='GET'):\n    req=urllib.request.Request(BASE+path,method=method,headers={'Authorization':'Bearer\
        \ '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})\n\
        \    with urllib.request.urlopen(req,timeout=30) as r:\n        body=r.read();return\
        \ json.loads(body) if body else {}\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n\
        \    def redirect_request(self,*args,**kwargs):return None\nopener=urllib.request.build_opener(NoRedirect)\n\
        def archive_url(artifact):\n    req=urllib.request.Request(BASE+f'/actions/artifacts/{artifact}/zip',headers={'Authorization':'Bearer\
        \ '+os.environ['GH_TOKEN']})\n    try:opener.open(req,timeout=30)\n    except\
        \ urllib.error.HTTPError as e:\n        if e.code in (301,302,303,307):return\
        \ e.headers['Location']\n        raise\n    raise ValueError('Expected artifact\
        \ redirect')\nclass RemoteZip(io.RawIOBase):\n    def __init__(self,url):\n\
        \        self.url=url;self.pos=0\n        req=urllib.request.Request(url,headers={'Range':'bytes=0-0'})\n\
        \        with urllib.request.urlopen(req,timeout=30) as r:\n            if\
        \ r.status!=206:raise ValueError('Range unsupported')\n            self.size=int(r.headers['Content-Range'].split('/')[-1]);r.read(1)\n\
        \    def seekable(self):return True\n    def readable(self):return True\n\
        \    def tell(self):return self.pos\n    def seek(self,offset,whence=0):\n\
        \        self.pos=offset if whence==0 else self.pos+offset if whence==1 else\
        \ self.size+offset\n        return self.pos\n    def read(self,n=-1):\n  \
        \      n=self.size-self.pos if n<0 else min(n,self.size-self.pos)\n      \
        \  if n<=0:return b''\n        if n>2*1024*1024:raise ValueError('Metadata\
        \ range limit')\n        req=urllib.request.Request(self.url,headers={'Range':f'bytes={self.pos}-{self.pos+n-1}'})\n\
        \        with urllib.request.urlopen(req,timeout=30) as r:\n            if\
        \ r.status!=206:raise ValueError('Range unsupported')\n            data=r.read(n)\n\
        \        self.pos+=len(data);return data\nartifacts=api(f'/actions/runs/{RUN}/artifacts?per_page=100')['artifacts']\n\
        selected=sorted([a for a in artifacts if a['name'].startswith('books-batch-')],key=lambda\
        \ a:int(a['name'].rsplit('-',1)[-1]))[:3]\nfor a in selected:\n    with zipfile.ZipFile(RemoteZip(archive_url(a['id'])))\
        \ as z:\n        name=next(n for n in z.namelist() if n.endswith('manifest.json'))\n\
        \        entries=json.loads(z.read(name))\n    entry=next(e for e in entries\
        \ if 'file' in e)\n    text=json.dumps({'artifact':a['name'],'name':entry.get('original_name'),'file':entry['file']},ensure_ascii=False)\n\
        \    print('::notice title=Book sample::'+text.replace('%','%25').replace('\\\
        n','%0A').replace('\\r','%0D'),flush=True)\nPY\n"
