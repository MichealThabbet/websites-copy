name: Heritage Downloader
on:
  workflow_dispatch:
    inputs:
      url:
        description: Public page, direct file or IIIF manifest URL
        required: true
        default: https://www.stmark-kw.net/category.aspx?catid=18
      mode:
        type: choice
        options: [page, file, iiif]
        default: page
permissions:
  contents: read
concurrency:
  group: heritage-downloader
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - env:
          TARGET: ${{ inputs.url }}
          MODE: ${{ inputs.mode }}
        run: python downloader.py "$TARGET" --mode "$MODE"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: heritage-downloads
          path: downloads/
          if-no-files-found: warn
          retention-days: 7
