name: Heritage Downloader
on:
  push:
    branches: [run/heritage-download]
  workflow_dispatch:
    inputs:
      url:
        description: Public page, direct file or IIIF manifest URL
        required: true
        default: https://www.stmark-kw.net/category.aspx?catid=18
      mode:
        type: choice
        options: [page, file, iiif]
        default: page
      skip_files:
        description: Number of earlier resources to skip
        default: '0'
      owner_authorized:
        description: I own this site and authorize downloading despite unavailable robots.txt
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: heritage-downloader
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - env:
          TARGET: ${{ inputs.url || 'https://www.stmark-kw.net/category.aspx?catid=18' }}
          OWNER_AUTHORIZED: ${{ github.event_name == 'push' || inputs.owner_authorized }}
          SKIP_FILES: ${{ github.event_name == 'push' && '10' || inputs.skip_files || '0' }}
          MODE: ${{ inputs.mode || 'page' }}
        run: |
          args=()
          if [ "$OWNER_AUTHORIZED" = "true" ]; then
            args+=(--authorized-origin https://www.stmark-kw.net)
            args+=(--authorized-origin https://stmark-media.s3.amazonaws.com)
            args+=(--authorized-origin https://stmark-media.s3.us-east-1.amazonaws.com)
          fi
          if [[ "$TARGET" == https://www.stmark-kw.net/* ]]; then
            args+=(--selector '#content' --extensions .pdf --max-files 50 --max-pages 100 --depth 4 --skip-files "$SKIP_FILES")
          fi
          python downloader.py "$TARGET" --mode "$MODE" "${args[@]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: heritage-downloads-next-50
          path: downloads/
          if-no-files-found: warn
          retention-days: 7
