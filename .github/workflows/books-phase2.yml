name: Books Phase 2 - Resume After Saved Batches
true:
  push:
    branches:
    - run/books-phase2
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: books-phase2
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      batches: ${{ steps.catalog.outputs.batches }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements.lock
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        name: books-catalog
        run-id: 41758227497
        github-token: ${{ github.token }}
    - id: catalog
      run: 'python3 - <<''PYCODE''

        import json,os,math

        from books import page_url

        from pathlib import Path

        c=json.loads(Path(''catalog.json'').read_text())

        assert len(c[''resources''])==1378

        assert not c[''errors'']

        assert all(page_url(p) for p in c[''pages''])

        batches=list(range(10,math.ceil(len(c[''resources''])/25)))

        with open(os.environ[''GITHUB_OUTPUT''],''a'') as f:f.write(''batches=''+json.dumps(batches)+''\n'')

        print(''::notice title=Resume::Skipping saved batches 0-9; downloading only
        batches 10-55'')

        PYCODE'
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: books-catalog
        path: catalog.json
        retention-days: 7
  download:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: ${{ fromJSON(needs.catalog.outputs.batches) }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements.lock
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        name: books-catalog
    - env:
        BATCH: ${{ matrix.batch }}
      run: python books.py download --batch "$BATCH"
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: always()
      with:
        name: books-batch-${{ matrix.batch }}
        path: downloads/
        compression-level: 0
        retention-days: 7
  report:
    needs:
    - catalog
    - download
    if: always() && needs.catalog.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        path: results
    - name: Report all books and exact failures
      run: "python3 - <<'PY'\nimport csv,json,os\nfrom pathlib import Path\ncatalog=json.loads(Path('results/books-catalog/catalog.json').read_text())\n\
        rows=[]\nmanifests=list(Path('results').glob('books-batch-*/manifest.json'))\n\
        for manifest in manifests:\n    for e in json.loads(manifest.read_text()):\n\
        \        rows.append({'name':e.get('original_name',''),'status':'downloaded'\
        \ if 'file' in e else 'failed','bytes':e.get('bytes',0),'artifact':manifest.parent.name,'file':e.get('file',''),'url':e['url'],'error':e.get('error','')})\n\
        ok=[r for r in rows if r['status']=='downloaded']\nfailed=[r for r in rows\
        \ if r['status']=='failed']\nunattempted=len(catalog['resources'])-len(rows)\n\
        Path('report').mkdir()\nif rows:\n    with open('report/books.csv','w',encoding='utf-8-sig',newline='')\
        \ as f:\n        w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)\n\
        Path('report/books.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')\n\
        Path('report/catalog.json').write_text(json.dumps(catalog,ensure_ascii=False,indent=2),encoding='utf-8')\n\
        def notice(title,text):\n    text=text.replace('%','%25').replace('\\r','%0D').replace('\\\
        n','%0A')\n    print(f'::notice title={title}::{text}',flush=True)\nnotice('Book\
        \ totals',f\"Catalog={len(catalog['resources'])}; Downloaded={len(ok)}; Failed={len(failed)};\
        \ Unattempted={unattempted}; CatalogErrors={len(catalog['errors'])}; Bytes={sum(r['bytes']\
        \ for r in ok)}\")\nnotice('Book title samples',json.dumps([r['name'] for\
        \ r in ok[:15]],ensure_ascii=False))\nnotice('Download failures',json.dumps([{'name':r['name'],'error':r['error']}\
        \ for r in failed],ensure_ascii=False))\nnotice('Excluded sections','مجلة\
        \ الكرازة، مجلة ينبوع المحبة، المقالات')\nwith open(os.environ['GITHUB_STEP_SUMMARY'],'a')\
        \ as f:\n    f.write(f\"# Books only\\n\\nCatalog: {len(catalog['resources'])};\
        \ Downloaded: {len(ok)}; Failed: {len(failed)}; Unattempted: {unattempted}.\\\
        n\\n\")\n    for r in ok:f.write('- '+r['name']+'\\n')\nif failed or unattempted\
        \ or catalog['errors']:raise SystemExit(1)\nPY\n"
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: always()
      with:
        name: books-file-list
        path: report/
        retention-days: 7
